<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Profesia Auto Apply</h1>
          <p>profesia.sk</p>
        </div>
      </div>
      <span id="live" class="pill idle">Idle</span>
    </header>

    <section class="stats glass" aria-label="Session stats">
      <div><b id="sent">0</b><span>Sent</span></div>
      <div><b id="skipped">0</b><span>Skip</span></div>
      <div><b id="failed">0</b><span>Fail</span></div>
      <div><b id="progress">0/0</b><span>Queue</span></div>
    </section>

    <div class="row">
      <button id="start" type="button">Start</button>
      <button id="stop" type="button">Stop</button>
    </div>

    <section class="logs glass">
      <div class="logs-head">Logs</div>
      <div id="log" class="log-body">Ready.</div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
